<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecochApp - Gestión de Recochas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background"></div>
    <div class="section-container">
        <a href="dashboard.html" class="back-btn">Volver a Panel de crack</a>
        <header>
            <h1><i class="fas fa-futbol"></i> Gestión de Recochas</h1>
            <p>Organiza partidos rápidos y convoca a tus amigos.</p>
        </header>

        <div id="matches-list-container" style="display: none; text-align: left; margin-bottom: 20px;">
            <h3 style="margin-bottom: 15px; color: var(--primary-green); border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">Partidos Programados</h3>
            <div id="matches-list" style="display: grid; gap: 15px;"></div>
        </div>

        <div id="empty-state" style="text-align: center; padding: 40px; border: 2px dashed var(--glass-border); border-radius: 15px;">
            <i class="fas fa-calendar-plus" style="font-size: 3rem; color: var(--primary-green); margin-bottom: 20px; display: block;"></i>
            <h3>No tienes partidos programados</h3>
            <p style="color: var(--text-dim); margin-bottom: 25px;">Empieza creando tu primer partido para hoy.</p>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <button id="create-match-btn" class="login-btn" style="width: auto; padding: 12px 30px;">Crear Nuevo Partido</button>
        </div>
        
        <div id="create-match-form" style="display: none; margin-top: 30px; text-align: left; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 10px;">
            <h3 style="margin-bottom: 15px; color: var(--primary-green);">Detalles del Partido</h3>
            <form id="new-match-form">
                <div class="form-group">
                    <label for="match-date">Fecha</label>
                    <input type="date" id="match-date" required>
                </div>
                <div class="form-group">
                    <label for="match-time">Hora</label>
                    <input type="time" id="match-time" required>
                </div>
                <div class="form-group">
                    <label for="match-location">Lugar</label>
                    <input type="text" id="match-location" placeholder="Ej: Cancha sintética, Polideportivo..." required>
                </div>
                <div class="form-group" id="map-container" style="display: none; margin-top: 15px; animation: fadeIn 0.5s ease-out;">
                    <iframe id="google-map" width="100%" height="250" style="border:0; border-radius: 10px; border: 1px solid var(--glass-border);" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <button type="submit" id="submit-match-btn" class="login-btn" disabled>Programar Partido</button>
                <button type="button" id="cancel-match-btn" class="login-btn" style="background: rgba(255,255,255,0.1); color: var(--text-white); margin-top: 10px;">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const createBtn = document.getElementById('create-match-btn');
            const formDiv = document.getElementById('create-match-form');
            const cancelBtn = document.getElementById('cancel-match-btn');
            const newMatchForm = document.getElementById('new-match-form');
            const matchesListContainer = document.getElementById('matches-list-container');
            const matchesList = document.getElementById('matches-list');
            const emptyState = document.getElementById('empty-state');

            const currentUserApodo = localStorage.getItem('user_apodo');
            if (!currentUserApodo) {
                window.location.href = 'login.html';
                return;
            }

            const API_URL = 'http://localhost:3001/api/recochas';

            // Load matches from API
            const loadMatches = async () => {
                try {
                    const response = await fetch(`${API_URL}/usuario/${currentUserApodo}`);
                    const matches = await response.json();
                    
                    if (matches && matches.length > 0) {
                        emptyState.style.display = 'none';
                        matchesListContainer.style.display = 'block';
                        matchesList.innerHTML = matches.map(match => {
                            const isCreator = match.creadorApodo === currentUserApodo;
                            const status = isCreator ? 'ACCEPTED' : (match.invitados ? match.invitados[currentUserApodo] : 'PENDING');
                            
                            let statusHtml = '';
                            if (status === 'ACCEPTED' || isCreator) {
                                statusHtml = `<span style="background: rgba(57, 255, 20, 0.2); color: var(--primary-green); padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold;">Programado</span>`;
                            } else if (status === 'PENDING') {
                                statusHtml = `
                                    <div style="display: flex; gap: 10px; align-items: center;">
                                        <span style="color: var(--text-dim); font-size: 0.8rem;">Invitación:</span>
                                        <button onclick="respondInvite('${match.id}', 'ACCEPTED')" style="background: none; border: none; color: var(--primary-green); cursor: pointer; font-size: 1.2rem;" title="Aceptar"><i class="fas fa-check-circle"></i></button>
                                        <button onclick="respondInvite('${match.id}', 'REJECTED')" style="background: none; border: none; color: #ff4c4c; cursor: pointer; font-size: 1.2rem;" title="Rechazar"><i class="fas fa-times-circle"></i></button>
                                    </div>
                                `;
                            }

                            const inviteSection = (isCreator || status === 'ACCEPTED') ? `
                                <div style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                                    <form onsubmit="inviteToMatch(event, '${match.id}')" style="display: flex; gap: 10px;">
                                        <input type="text" id="invite-input-${match.id}" placeholder="Apodo de jugador o nombre de club..." required style="flex: 1; padding: 8px; border-radius: 5px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: white; font-size: 0.9rem;">
                                        <button type="submit" class="login-btn" style="padding: 8px 15px; width: auto; font-size: 0.9rem;"><i class="fas fa-user-plus"></i> Invitar</button>
                                    </form>
                                    <div style="margin-top: 10px; font-size: 0.8rem; color: var(--text-dim);">
                                        <strong>Invitados confirmados:</strong> 
                                        ${match.invitados ? Object.keys(match.invitados).filter(k => match.invitados[k] === 'ACCEPTED').join(', ') || 'Ninguno' : 'Ninguno'}
                                    </div>
                                </div>
                            ` : '';

                            return `
                            <div style="background: var(--input-bg); padding: 15px; border-radius: 10px; border-left: 4px solid ${status === 'PENDING' ? '#ffaa00' : 'var(--primary-green)'};">
                                <div style="display: flex; justify-content: space-between; align-items: start;">
                                    <div>
                                        <h4 style="font-size: 1.1rem; margin-bottom: 5px;"><i class="fas fa-map-marker-alt" style="color: var(--primary-green);"></i> ${match.location}</h4>
                                        <p style="color: var(--text-dim); font-size: 0.9rem;"><i class="far fa-calendar-alt"></i> ${match.date} &nbsp; <i class="far fa-clock"></i> ${match.time}</p>
                                        ${!isCreator ? `<p style="font-size: 0.8rem; color: #aaa; margin-top: 5px;"><i class="fas fa-user"></i> Creado por: @${match.creadorApodo}</p>` : ''}
                                    </div>
                                    <div style="text-align: right;">
                                        ${statusHtml}
                                    </div>
                                </div>
                                ${inviteSection}
                            </div>
                            `;
                        }).join('');
                    } else {
                        emptyState.style.display = 'block';
                        matchesListContainer.style.display = 'none';
                    }
                } catch (error) {
                    console.error('Error loading matches:', error);
                    matchesList.innerHTML = '<p style="color: red;">Error al cargar las recochas desde el servidor.</p>';
                    emptyState.style.display = 'none';
                    matchesListContainer.style.display = 'block';
                }
            };

            loadMatches();

            createBtn.addEventListener('click', () => {
                createBtn.style.display = 'none';
                formDiv.style.display = 'block';
            });

            cancelBtn.addEventListener('click', () => {
                formDiv.style.display = 'none';
                createBtn.style.display = 'inline-block';
                newMatchForm.reset();
                document.getElementById('map-container').style.display = 'none';
                document.getElementById('google-map').src = '';
                document.getElementById('submit-match-btn').disabled = true;
            });

            newMatchForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const date = document.getElementById('match-date').value;
                const time = document.getElementById('match-time').value;
                const location = document.getElementById('match-location').value;
                
                const newMatch = { creadorApodo: currentUserApodo, date, time, location };
                
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newMatch)
                    });
                    
                    if (response.ok) {
                        formDiv.style.display = 'none';
                        createBtn.style.display = 'inline-block';
                        newMatchForm.reset();
                        document.getElementById('map-container').style.display = 'none';
                        document.getElementById('google-map').src = '';
                        document.getElementById('submit-match-btn').disabled = true;
                        loadMatches();
                    } else {
                        alert('Error al crear el partido en el servidor.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error de conexión.');
                }
            });

            // Global functions for inline onclick handlers
            window.inviteToMatch = async (e, matchId) => {
                e.preventDefault();
                const inputEl = document.getElementById(`invite-input-${matchId}`);
                const target = inputEl.value.trim();

                try {
                    const response = await fetch(`${API_URL}/${matchId}/invitar`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ target })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        alert(data.message || 'Invitaciones enviadas.');
                        inputEl.value = '';
                        loadMatches();
                    } else {
                        alert(data.error || 'Error al invitar.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error de conexión.');
                }
            };

            window.respondInvite = async (matchId, status) => {
                try {
                    const response = await fetch(`${API_URL}/${matchId}/respuesta`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ apodo: currentUserApodo, respuesta: status })
                    });
                    
                    if (response.ok) {
                        loadMatches();
                    } else {
                        const data = await response.json();
                        alert(data.error || 'Error al responder a la invitación.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error de conexión.');
                }
            };

            // Google Maps Integration
            const locationInput = document.getElementById('match-location');
            const mapContainer = document.getElementById('map-container');
            const googleMap = document.getElementById('google-map');
            const submitBtn = document.getElementById('submit-match-btn');
            let debounceTimer;

            const loadMap = (query) => {
                submitBtn.disabled = true;
                const encodedQuery = encodeURIComponent(query);
                googleMap.src = `https://www.google.com/maps/embed/v1/place?key=AIzaSyBRSYAUPUHC-tW1ua5XSMaTFSTv34hXw58&q=${encodedQuery}`;
                mapContainer.style.display = 'block';
            };

            googleMap.addEventListener('load', () => {
                if (googleMap.src && googleMap.src !== '') {
                    submitBtn.disabled = false;
                }
            });

            locationInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                const query = e.target.value.trim();
                
                if (query.length > 4) {
                    submitBtn.disabled = true;
                    debounceTimer = setTimeout(() => {
                        loadMap(query);
                    }, 1000); // Wait 1 second after typing stops to load map
                } else {
                    mapContainer.style.display = 'none';
                    googleMap.src = '';
                    submitBtn.disabled = true;
                }
            });

            locationInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault(); // Prevent instant form submission
                    const query = e.target.value.trim();
                    if (query.length > 4) {
                        clearTimeout(debounceTimer);
                        loadMap(query);
                    }
                }
            });
        });
    </script>
</body>
</html>
